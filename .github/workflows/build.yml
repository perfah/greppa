# Builds the Rust server binaries for every supported platform and the
# plugin for both IDE targets - one job per target - and publishes a
# GitHub Release with installable zips, but only for version tags
# (v1.0.0): a plain push only produces the workflow's build artifacts,
# so the release list stays signal instead of accumulating one release
# per commit.
#
# The server binaries are built on each platform's native runner, so no
# cross-compilation toolchains are needed: windows-latest is x64,
# macos-latest is arm64 (Apple Silicon) and ubuntu-latest is x64. Each
# binary is staged under the platform-specific name the plugin's
# descriptor looks up at runtime (see
# GreppaLspServerDescriptor.bundledBinaryName) and that the Gradle build
# bundles from lsp_server/bin (see the prepareSandbox block in
# build.gradle.kts).
#
# The plugin zips are signed in CI with the Gradle signPlugin task,
# using the certificate chain, private key and key password from the
# CERTIFICATE_CHAIN, PRIVATE_KEY and PRIVATE_KEY_PASSWORD repository
# secrets - the "environment variables" signing method, so the signing
# material never appears in the repository or the command line. The
# one-time certificate generation and its upload to JetBrains Marketplace
# happen outside CI (see the "Generating a certificate" section of
# https://plugins.jetbrains.com/docs/intellij/plugin-signing.html).
#
# The build scripts need no signing configuration: the IntelliJ
# Platform Gradle Plugin 2.x (see build.gradle.kts) registers a
# signPlugin task per project whose certificate chain, private key and
# password default to those environment variables. The task writes the
# signed zip under the original buildPlugin name (greppa-<version>.zip)
# and keeps its unsigned input alongside it as <name>-unsigned.zip.
# The unsigned copy is a build intermediate nothing consumes - every
# consumer (Marketplace upload, install from disk, release asset) takes
# the signed zip - so the plugin jobs remove it before the upload and
# the artifact paths below catch the signed zip only. A local
# ./gradlew buildPlugin without the variables stays unsigned, which
# only matters for Marketplace uploads, not for the runIde sandbox or
# installing from disk.
#
# The signature lives in the zip file itself, so the exact zip
# signPlugin produces is what gets uploaded and released: the previous
# flow extracted the plugin folder from the zip and the release job
# re-zipped it, and an extracted-and-repacked zip is unsigned. The
# build artifacts are therefore the signed zips themselves - a download
# is GitHub's wrapper zip holding the signed plugin zip, so installing
# from an artifact download takes one extraction - and the release
# assets are the signed zips renamed to their versioned names.
#
# One consequence is handled in the plugin jobs: artifact downloads do
# not preserve file permissions, so the bundled macOS/Linux server
# binaries lose their executable bit when the server artifacts are
# downloaded. The bit is restored right after the download, before the
# Gradle build, so it is set inside the zip Gradle builds (Gradle's zip
# tasks preserve Unix permissions) and survives every later round-trip
# untouched - the zip is never unpacked again. The plugin also restores
# the bit before launching the binary (see
# GreppaLspServerDescriptor.createCommandLine).
#
# The release assets are named greppa-<version>-rustrover.zip /
# greppa-<version>-intellij.zip; the version comes from the tag
# (v1.0.0 -> 1.0.0), so version tags are expected to match the plugin
# version in plugin.xml.
#
# The publish job uploads the plugin to the JetBrains Marketplace, for
# version tags only like the GitHub release, through the IntelliJ
# Platform Gradle Plugin's publishPlugin task - one per target,
# mirroring the build jobs: :publishPlugin publishes the RustRover zip
# and :idea:publishPlugin the IntelliJ IDEA zip. The task reads the
# Marketplace personal access token from the intellijPlatformPublishingToken
# project property, which the job provides through its environment
# variable spelling (ORG_GRADLE_PROJECT_intellijPlatformPublishingToken)
# from the PUBLISHING_TOKEN repository secret - like the signing
# material, the token never appears in the repository or the command
# line. The job rebuilds the zips it uploads: publishPlugin builds,
# signs and uploads its own distribution, so it stages the server
# binaries and passes the signing secrets like the plugin jobs.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  server:
    name: Server binary (${{ matrix.staged }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: lsp_server.exe
            staged: lsp_server-windows-x64.exe
          - os: macos-latest
            binary: lsp_server
            staged: lsp_server-macos-arm64
          - os: ubuntu-latest
            binary: lsp_server
            staged: lsp_server-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lsp_server
      - name: Build
        run: cargo build --release
        working-directory: lsp_server
      - name: Stage
        shell: bash
        run: |
          mkdir -p lsp_server/bin
          cp "lsp_server/target/release/${{ matrix.binary }}" "lsp_server/bin/${{ matrix.staged }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.staged }}
          path: lsp_server/bin/${{ matrix.staged }}

  plugin-rustrover:
    name: Plugin (RustRover)
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # All three platform binaries, merged into the staging directory
      # the Gradle build bundles from.
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: lsp_server/bin
      # Restore the executable bit the artifact download lost (see the
      # workflow header comment), so the bundled macOS/Linux server
      # binaries are executable inside the plugin zip Gradle builds.
      - name: Restore server binary permissions
        run: chmod +x lsp_server/bin/lsp_server-*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # The qualified :buildPlugin task name builds only the root
      # project's zip (the RustRover target); the IntelliJ IDEA zip is
      # built by the plugin-intellij job. signPlugin then signs that
      # zip, reading the signing material from the environment, and
      # leaves two zips in the distributions directory: the signed one
      # under the original name and its unsigned input as
      # <name>-unsigned.zip (see the workflow header comment). chmod
      # guards against the wrapper's executable bit being lost when
      # the scripts were committed from Windows.
      - name: Build and sign plugin zip
        working-directory: jetbrains_plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :buildPlugin :signPlugin
      # signPlugin keeps its unsigned input zip next to the signed one
      # (its name contains "unsigned"); nothing consumes it - every
      # consumer takes the signed zip (see the workflow header comment)
      # - so remove it here. The upload path below then catches the
      # signed zip only, and the release job's rename gets exactly one
      # zip per artifact. rm -f keeps the step green should a future
      # plugin version stop producing the unsigned copy.
      - name: Remove unsigned plugin zip
        run: rm -f jetbrains_plugin/build/distributions/*unsigned*.zip
      # The signed zip itself is the artifact: the signature lives in
      # the zip file, so the exact zip signPlugin produced must be what
      # is uploaded and released - extracting the plugin folder and
      # re-zipping it (the previous flow) yields an unsigned zip. With
      # the unsigned copy removed above, the glob catches the signed
      # zip only. A download is therefore GitHub's wrapper zip holding
      # the signed plugin zip; installing from an artifact download
      # takes one extraction.
      - uses: actions/upload-artifact@v4
        with:
          name: greppa-rustrover
          path: jetbrains_plugin/build/distributions/*.zip

  plugin-intellij:
    name: Plugin (IntelliJ IDEA)
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # All three platform binaries, merged into the staging directory
      # the Gradle build bundles from.
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: lsp_server/bin
      # Restore the executable bit the artifact download lost (see the
      # workflow header comment), so the bundled macOS/Linux server
      # binaries are executable inside the plugin zip Gradle builds.
      - name: Restore server binary permissions
        run: chmod +x lsp_server/bin/lsp_server-*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # The qualified :idea:buildPlugin task name builds only the idea
      # subproject's zip (the IntelliJ IDEA target); the RustRover zip
      # is built by the plugin-rustrover job. signPlugin then signs
      # that zip, reading the signing material from the environment,
      # and leaves two zips in the distributions directory: the signed
      # one under the original name and its unsigned input as
      # <name>-unsigned.zip (see the workflow header comment). chmod
      # guards against the wrapper's executable bit being lost when
      # the scripts were committed from Windows.
      - name: Build and sign plugin zip
        working-directory: jetbrains_plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :idea:buildPlugin :idea:signPlugin
      # signPlugin keeps its unsigned input zip next to the signed one;
      # nothing consumes it, so remove it here - see the rustrover
      # job's removal step for the reasoning. rm -f keeps the step
      # green should a future plugin version stop producing the
      # unsigned copy.
      - name: Remove unsigned plugin zip
        run: rm -f jetbrains_plugin/idea/build/distributions/*unsigned*.zip
      # The signed zip itself is the artifact; see the rustrover job's
      # upload step for why the zip must not be unpacked.
      - uses: actions/upload-artifact@v4
        with:
          name: greppa-intellij
          path: jetbrains_plugin/idea/build/distributions/*.zip

  publish:
    name: Publish to JetBrains Marketplace
    # Marketplace uploads are releases like the GitHub release below:
    # only version tags publish. The job needs the plugin jobs so a
    # broken build never reaches the Marketplace; their zips are not
    # reused though - publishPlugin builds, signs and uploads its own
    # distribution - so this job stages the server binaries and passes
    # the signing secrets exactly like the plugin jobs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin-rustrover, plugin-intellij]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # All three platform binaries, merged into the staging directory
      # the Gradle build bundles from; publishPlugin builds the zips it
      # uploads, so it needs the bundled server binaries like the
      # plugin jobs.
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: lsp_server/bin
      # Restore the executable bit the artifact download lost (see the
      # workflow header comment), so the bundled macOS/Linux server
      # binaries are executable inside the zips publishPlugin builds.
      - name: Restore server binary permissions
        run: chmod +x lsp_server/bin/lsp_server-*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # One publishPlugin task per target, mirroring the plugin jobs'
      # build tasks: the root project's task publishes the RustRover
      # zip, the idea subproject's task the IntelliJ IDEA zip. The
      # token reaches Gradle as the intellijPlatformPublishingToken
      # project property through its ORG_GRADLE_PROJECT_ environment
      # variable spelling, from the PUBLISHING_TOKEN repository
      # secret; the signing material is passed too, because
      # publishPlugin signs the zip it uploads. Both targets share the
      # plugin id and version, so the two uploads land on the same
      # Marketplace plugin. chmod guards against the wrapper's
      # executable bit being lost when the scripts were committed from
      # Windows.
      - name: Publish plugin zips
        working-directory: jetbrains_plugin
        env:
          ORG_GRADLE_PROJECT_intellijPlatformPublishingToken: ${{ secrets.PUBLISHING_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :publishPlugin :idea:publishPlugin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin-rustrover, plugin-intellij]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Both per-target artifacts (greppa-rustrover, greppa-intellij),
      # each into its own subdirectory: the two signed zips can carry
      # the same file name from their Gradle projects, which a merged
      # download would overwrite.
      - uses: actions/download-artifact@v4
        with:
          pattern: greppa-*
          path: dist
      # The release assets are the signed zips the plugin jobs built,
      # renamed to their versioned names - not re-zipped, which would
      # strip the signature (see the workflow header comment). Each
      # artifact holds exactly one zip - the plugin jobs removed the
      # unsigned copies - so each glob matches a single file and the
      # rename cannot collide. The version comes from the tag
      # (v1.0.0 -> 1.0.0): the release only runs for version tags,
      # which are expected to match the plugin version in plugin.xml.
      - name: Stage release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv dist/greppa-rustrover/*.zip "dist/greppa-$version-rustrover.zip"
          mv dist/greppa-intellij/*.zip "dist/greppa-$version-intellij.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate-release-notes: true
