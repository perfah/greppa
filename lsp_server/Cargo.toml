[package]
name = "lsp_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35.0", features = ["full"] }
tower-lsp = "0.20.0"
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The LLM client, pointed at any OpenAI-compatible service (see
# llm_base_url in tick_listener.rs). native-tls instead of the crate's
# default rustls backend: the default enables reqwest/rustls-tls, whose
# rustls -> ring chain does not compile on aarch64-apple-darwin with
# current Rust - ring's compile-time CPU-feature assertions
# (src/cpu/arm/darwin.rs) panic with E0080, which broke the macOS CI
# leg while Windows and Linux built fine. native-tls uses the OS's TLS
# stack instead (Security.framework on macOS, schannel on Windows,
# OpenSSL on Linux), so ring leaves the dependency tree entirely and
# the CI toolchain needs no version pin. TLS is only exercised for
# hosted services anyway; the default base URL is a local Ollama over
# plain HTTP. Linux builds need OpenSSL's headers (GitHub's ubuntu
# runners ship them).
async-openai = { version = "0.14", default-features = false, features = ["native-tls"] }
# Consuming the token stream from the streaming endpoint
# (futures::StreamExt in tick_listener.rs).
futures = "0.3"
anyhow = "1.0"
dashmap = "6.1.0"
chrono = "0.4"
lazy_static = "1.4"
indexmap = "2.14.2"

[[bin]]
name = "lsp_server"
