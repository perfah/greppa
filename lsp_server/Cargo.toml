[package]
name = "lsp_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35.0", features = ["full"] }
tower-lsp = "0.20.0"
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-openai = "0.14"
# Consuming the token stream from the Ollama streaming endpoint
# (futures::StreamExt in ollama_tick_listener.rs).
futures = "0.3"
anyhow = "1.0"
dashmap = "6.1.0"
chrono = "0.4"
lazy_static = "1.4"
indexmap = "2.14.2"

[[bin]]
name = "lsp_server"
